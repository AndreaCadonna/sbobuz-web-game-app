# Sbobuz server Deployment.
#
# Locked decisions reflected here:
#   - Rolling updates: maxSurge=1, maxUnavailable=0 (zero-downtime)
#   - terminationGracePeriodSeconds=30 (matches 30s disconnect grace)
#   - Prom metrics on port 9464
#
# Replicas set to 1 in base; overridden by overlays (staging: 1, prod: 2).
# Image tag is a placeholder — Kustomize `images` transformer or
# `kustomize edit set image` in CI replaces it at deploy time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbobuz-server
  labels:
    app: sbobuz-server
    app.kubernetes.io/name: sbobuz-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: sbobuz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sbobuz-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime: new pod must be Ready before old pod is terminated.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sbobuz-server
        app.kubernetes.io/name: sbobuz-server
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: sbobuz
    spec:
      # 30s matches the DEFAULT_DISCONNECT_GRACE_SECONDS config value.
      # During shutdown the server stops accepting new connections, waits for
      # in-flight game actions to complete, and sends disconnect events to
      # connected players so they can reconnect to a different pod.
      terminationGracePeriodSeconds: 30

      # Run as non-root for security (matches Dockerfile USER node).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: sbobuz-server
          # Placeholder image — replaced by Kustomize images transformer.
          # The deploy pipeline runs: kustomize edit set image sbobuz-server=ghcr.io/.../sbobuz-server:<sha>
          image: sbobuz-server
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP

          envFrom:
            - configMapRef:
                name: sbobuz-config
            - secretRef:
                name: sbobuz-secrets

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          # Liveness: is the process alive and responsive?
          # Failure triggers pod restart.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness: can this pod accept traffic?
          # Failure removes the pod from Service endpoints.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Writable /tmp for Node.js (e.g. V8 heap snapshots, temp files).
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
