# Staging Ingress for the Sbobuz server.
#
# Uses nginx ingress controller with:
#   - cert-manager for automatic TLS via Let's Encrypt
#   - WebSocket-aware timeouts (3600s) to prevent premature disconnects
#   - Sticky sessions via cookie to ensure Socket.IO long-polling
#     handshakes consistently route to the same pod
#   - Proxy buffer sizing for Socket.IO payloads
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbobuz-ingress
  annotations:
    # Ingress class selection
    kubernetes.io/ingress.class: nginx

    # TLS: cert-manager issues and renews certificates automatically
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # WebSocket support: long timeouts prevent nginx from closing
    # idle WebSocket connections. 3600s = 1 hour, matching the
    # Service sessionAffinity timeout.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # Sticky sessions: ensures Socket.IO HTTP long-polling transport
    # (used during the initial handshake) routes to the same pod.
    # After WebSocket upgrade, the persistent connection handles affinity.
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: sbobuz-affinity
    nginx.ingress.kubernetes.io/session-cookie-hash: sha1
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"

    # Proxy buffer config for Socket.IO payloads
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging-api.sbobuz.com
      secretName: sbobuz-staging-tls
  rules:
    - host: staging-api.sbobuz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sbobuz-server
                port:
                  name: http
