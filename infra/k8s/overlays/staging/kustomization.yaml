# Staging overlay for the Sbobuz application.
#
# Key differences from base:
#   - Namespace: sbobuz-staging
#   - NODE_ENV: staging
#   - Full trace sampling (1.0) for easier debugging
#   - Single replica (cost savings)
#   - Ingress with staging-api.sbobuz.com hostname
#
# The `images` section uses a placeholder tag. The deploy pipeline
# replaces this via `kustomize edit set image` before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

namespace: sbobuz-staging

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml

images:
  - name: sbobuz-server
    newName: ghcr.io/andreacadonna/sbobuz-server
    newTag: latest
