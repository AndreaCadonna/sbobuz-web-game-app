# Production Ingress for the Sbobuz server.
#
# Same nginx ingress configuration as staging, with the production hostname.
# See staging/ingress.yaml for detailed annotation explanations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbobuz-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: sbobuz-affinity
    nginx.ingress.kubernetes.io/session-cookie-hash: sha1
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.sbobuz.com
      secretName: sbobuz-production-tls
  rules:
    - host: api.sbobuz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sbobuz-server
                port:
                  name: http
