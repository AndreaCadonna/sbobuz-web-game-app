# Horizontal Pod Autoscaler for production.
#
# Scales between 2 and 5 replicas based on CPU utilization.
# The 70% CPU target leaves headroom for traffic spikes before
# new pods finish starting up (~10s based on readiness probe config).
#
# Scale-down stabilization (300s) prevents flapping during brief
# traffic drops — pods are kept for 5 minutes after load decreases
# to avoid unnecessary churn.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sbobuz-server
  labels:
    app: sbobuz-server
    app.kubernetes.io/name: sbobuz-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: sbobuz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sbobuz-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
