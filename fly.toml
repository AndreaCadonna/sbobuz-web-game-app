# Fly.io configuration for sbobuz-api (Express + Socket.IO backend)
#
# Deploy: fly deploy --config fly.toml --remote-only --app sbobuz-api

app = "sbobuz-api"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "infra/docker/Dockerfile.production"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"

  # Database pool (Fly Postgres single-node)
  DB_POOL_MIN = "2"
  DB_POOL_MAX = "10"
  DB_STATEMENT_TIMEOUT_MS = "30000"
  MIGRATE_ON_STARTUP = "true"

  # Redis
  REDIS_COMMAND_TIMEOUT_MS = "2000"

  # Auth
  JWT_ACCESS_TOKEN_TTL_SECONDS = "900"
  JWT_REFRESH_TOKEN_TTL_SECONDS = "604800"
  BCRYPT_COST_FACTOR = "12"

  # Rate limiting
  RATE_LIMIT_WINDOW_MS = "60000"
  RATE_LIMIT_MAX_REQUESTS = "100"

  # Game
  DEFAULT_TURN_TIMER_SECONDS = "60"
  DEFAULT_DISCONNECT_GRACE_SECONDS = "30"
  MAX_GAMES_PER_INSTANCE = "200"
  GAME_SNAPSHOT_INTERVAL_ACTIONS = "10"
  GAME_SNAPSHOT_INTERVAL_SECONDS = "30"

  # WebSocket
  WS_PING_INTERVAL_MS = "25000"
  WS_PING_TIMEOUT_MS = "5000"
  WS_MAX_PAYLOAD_BYTES = "16384"

  # Observability (disable OTLP exporter in Fly unless configured)
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317"
  OTEL_TRACE_SAMPLING_RATE = "0.1"
  METRICS_PORT = "9464"

  # CORS -- update after setting up custom domains
  CORS_ALLOWED_ORIGINS = "https://sbobuz-web.fly.dev"

  # Features
  ENABLE_AI_OPPONENT = "true"
  ENABLE_MATCHMAKING = "false"

# Secrets set via CLI (not in this file):
#   DATABASE_URL, REDIS_URL, JWT_SECRET

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[services]]
  protocol = "tcp"
  internal_port = 9464

  [[services.ports]]
    port = 9464
    handlers = ["http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[checks]]
  name = "liveness"
  port = 3000
  type = "http"
  method = "GET"
  path = "/health/live"
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"

[[checks]]
  name = "readiness"
  port = 3000
  type = "http"
  method = "GET"
  path = "/health/ready"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
