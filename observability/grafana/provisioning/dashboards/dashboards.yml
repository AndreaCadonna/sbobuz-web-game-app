# Grafana dashboard provisioning configuration.
#
# Dashboards are loaded from JSON files on disk. This is the "infrastructure
# as code" approach — dashboards are version-controlled and deploy automatically
# on Grafana startup. No manual dashboard creation in the UI.
#
# The dashboard directory is mounted from observability/grafana/dashboards/
# into the container at /var/lib/grafana/dashboards.
#
# @see docs/specs/observability-stack.md Decision #7

apiVersion: 1

providers:
  - name: Sbobuz
    orgId: 1
    type: file
    disableDeletion: false
    # Re-scan the dashboard directory every 30 seconds to pick up changes.
    # In development, this allows editing JSON files and seeing updates
    # without restarting Grafana.
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
