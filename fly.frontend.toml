# Fly.io configuration for sbobuz-web (Next.js frontend)
#
# Deploy: fly deploy --config fly.frontend.toml --remote-only --app sbobuz-web

app = "sbobuz-web"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "infra/docker/Dockerfile.frontend"

  [build.args]
    NEXT_PUBLIC_API_BASE_URL = "https://sbobuz-api.fly.dev"
    NEXT_PUBLIC_SOCKET_URL = "https://sbobuz-api.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[checks]]
  name = "health"
  port = 3000
  type = "http"
  method = "GET"
  path = "/"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
